apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: ticket-assitant
  labels:
    app: ml-service
    app.kubernetes.io/component: ml-engine
    app.kubernetes.io/part-of: ticket-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
        app.kubernetes.io/component: ml-engine
        app.kubernetes.io/part-of: ticket-assistant
    spec:
      serviceAccountName: backend-sa
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: ml-service
          image: ml-service-image:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: TAXONOMY_VERSION
              value: "v1.0"
            - name: EMBEDDING_MODEL_NAME
              value: "all-MiniLM-L6-v2"
          envFrom:
            - secretRef:
                name: ticket-backend-secrets
                optional: true
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2048Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
